################
### MONITORS ###
################

monitor=DP-2,preferred,auto,1
monitor=eDP-1,1920x1080@60.056,0x0,1

exec-once=hyprctl keyword monitor DP-2,preferred,auto,1

# Assign workspace 10 to the laptop screen
workspace=10,monitor:eDP-1

# Move other workspaces to the external monitor
workspace=1,monitor:DP-2
workspace=2,monitor:DP-2
workspace=3,monitor:DP-2
workspace=4,monitor:DP-2
workspace=5,monitor:DP-2
workspace=6,monitor:DP-2
workspace=7,monitor:DP-2
workspace=8,monitor:DP-2
workspace=9,monitor:DP-2


###################
### MY PROGRAMS ###
###################

$terminal = konsole
$fileManager = dolphin
$menu = wofi --show drun -IG
$volume = 5%

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = pactl set-source-mute @DEFAULT_SOURCE@ 1
exec-once = syncthing --no-browser

# mute the microphone when you connect another monitor
exec-once = hyprctl dispatch exec [monitoradded] pactl set-source-mute @DEFAULT_SOURCE@ 1

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

#####################
### LOOK AND FEEL ###
#####################

general {
    # big gaps 10 15
    # mid gaps 4 8
    # small gaps 2 4
    gaps_in = 2
    gaps_out = 4
    border_size = 3

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true 
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 7
    active_opacity = 1.0
    inactive_opacity = 1.0

#    drop_shadow = false
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)

    blur {
        enabled = false
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.215,0.61,0.355,1

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 1, default, popin 100%
    animation = border, 1, 3, default
    animation = borderangle, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}
windowrule = animation slide 0ms, ^(wofi)$

dwindle {
    pseudotile = true
    force_split = 2
    preserve_split = true
}

master {
    #new_is_master = false
}

misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vfr = true
    enable_swallow = true
    swallow_regex = .*
}
#############
### INPUT ###
#############

input {
    kb_layout = us,il
    kb_variant =
    kb_model =
    kb_options = caps:escape,grp:alt_shift_toggle
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER

bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, E, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, togglefloating

# apps
bind = $mainMod, Q, exec, qbittorrent
bind = $mainMod, B, exec, librewolf --profile ~/.config/librewolf/public --new-window 
bind = $mainMod, M, exec, steam
bind = $mainMod, W, exec, librewolf --profile ~/.config/librewolf/public --new-window https://web.whatsapp.com
bind = $mainMod, G, exec, $terminal -e btop
bind = $mainMod, V, exec, virt-manager
bind = $mainMod, S, exec, stremio
bind = $mainMod, U, exec, bottles-cli run -p 'dark souls' -b 'dark' -- %u

# Move window focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u

# switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volume+ && pactl set-sink-mute @DEFAULT_SINK@ 0
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volume- && pactl set-sink-mute @DEFAULT_SINK@ 0
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bindle = $mainMod, F8, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volume+ && pactl set-sink-mute @DEFAULT_SINK@ 0
bindle = $mainMod, F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ $volume- && pactl set-sink-mute @DEFAULT_SINK@ 0
bind = $mainMod, F6, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# brightness
$minBrightness = 13
$presentage = 35
bindle = , XF86MonBrightnessUp, exec, brightnessctl set $(( $(brightnessctl get) * 100 / $presentage + $minBrightness))
bindle = , XF86MonBrightnessDown, exec, brightnessctl set $(( $(brightnessctl get) * $presentage / 100 < $minBrightness ? 0 : $(brightnessctl get) * $presentage / 100 ))

# toggle mic
bind = $mainModm, Y, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
# print screen
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/pictures/Screenshots/$(date +'%Y-%m-%d-%H%M%S.png')
# lock
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/power-script
bind = $mainMod SHIFT, K, exec, hyprctl kill
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

windowrulev2 = workspace 4, class:^(steam)$
windowrulev2 = workspace 3, class:^(com.stremio.stremio)$

